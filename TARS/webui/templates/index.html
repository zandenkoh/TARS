{% extends "base.html" %}

{% block content %}
<style>
    .input-container {
        position: relative;
        background-color: #303030;
        border-radius: 28px;
        border: 1px solid transparent;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto;
        grid-template-areas: "leading primary trailing";
        align-items: end;
    }
    .input-container:focus-within {
        border-color: rgba(255, 255, 255, 0.1);
        background-color: #353535;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .input-container[data-state="multi"] {
        border-radius: 1.25rem;
        grid-template-areas:
            "primary primary primary"
            "leading footer trailing";
    }
    .chat-textarea {
        transition: height 0.2s ease-out;
    }
</style>
<meta id="tars-config-data" data-config='{{ config.model_dump(by_alias=True) | tojson | safe }}'>
<div class="flex h-screen overflow-hidden bg-tars-black text-zinc-300 font-inter">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 md:hidden opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- Left Sidebar (Glassmorphism) -->
    <aside id="sidebar"
        class="fixed md:relative inset-y-0 left-0 w-[260px] flex flex-col bg-[#181818] border-r border-white/[0.04] transition-transform duration-300 ease-in-out z-50 -translate-x-full md:translate-x-0">
        <!-- Sidebar Header -->
        <div class="px-4 py-4 flex items-center justify-between">
            <button aria-label="New Chat" onclick="newChat()"
                class="flex-1 flex items-center gap-3 px-3 py-2 text-sm font-semibold rounded-xl hover:bg-white/[0.05] hover:cursor-pointer text-zinc-200 transition-all group">
                <div
                    class="w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
                    <img src="/static/icon-192.png" alt="TARS" class="w-4 h-4 object-contain">
                </div>
                <svg class="ml-auto w-4 h-4 text-zinc-500" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>
            <button aria-label="Toggle Sidebar" onclick="toggleSidebar()"
                class="md:hidden p-2 hover:bg-white/5 rounded-lg transition-all text-zinc-500 hover:text-white ml-2">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Navigation Tabs -->
        <nav class="px-2 space-y-0.5">
            <button hx-get="/api/workspace" hx-target="#chat-messages" onclick="switchView('workspace')"
                class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                Workspace
            </button>
            <button hx-get="/api/tasks/today" hx-target="#chat-messages" onclick="switchView('tasks')"
                class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                    </path>
                </svg>
                Tasks
            </button>
            <button onclick="openSearchModal()"
                class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Search chats
            </button>
            <div id="sidebar-projects-container" class="mt-1">
                <!-- Dynamically populated by renderProjectsSidebar() -->
            </div>
        </nav>

        <!-- Recent Chats -->
        <div class="flex-1 px-2 mt-6 overflow-y-auto custom-scrollbar">
            <div
                class="px-3 text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 flex items-center gap-2">
                <span>Recent</span>
                <div class="h-[1px] flex-1 bg-white/[0.04]"></div>
            </div>
            <div id="session-history" class="space-y-0.5">
                <!-- Session items loaded via JS -->
            </div>
        </div>

        <!-- User Profile & Context Menu -->
        <div class="relative p-3 border-t border-white/[0.04] mt-auto">
            <!-- Context Menu (hidden by default) -->
            <div id="profile-context-menu" 
                class="absolute bottom-[calc(100%+8px)] bg-[#2f2f2f] rounded-2xl border border-white/[0.08] shadow-2xl overflow-hidden hidden animate-slide-up z-[60] w-full">
                <div class="flex flex-col w-full">
                    <div class="flex items-center gap-3 px-3 py-2 mb-1">
                        <div class="w-8 h-8 rounded-full bg-[#c55b5b] flex items-center justify-center text-[10px] font-bold text-white border border-[#c55b5b]/10 user-avatar-display shrink-0">
                            U
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-center">
                            <p class="text-[13px] font-semibold text-zinc-200 truncate user-name-display">User account</p>
                            <p class="text-[11px] text-zinc-400 truncate mt-0.5">Free</p>
                        </div>
                    </div>

                    <div class="h-[1px] bg-white/[0.08] my-1 mx-2"></div>

                    <button onclick="toggleProfileMenu(); openModal('Personalisation')" 
                        class="w-full flex items-center justify-start gap-3 px-4 py-3 text-[13px] font-medium hover:bg-white/[0.05] transition-all text-zinc-300 hover:text-zinc-100 group">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Personalization
                    </button>
                    <button hx-get="/api/config" hx-target="#modal-content" hx-on::after-request="openSettings()" onclick="toggleProfileMenu()"
                        class="w-full flex items-center justify-start gap-3 px-4 py-3 text-[13px] font-medium hover:bg-white/[0.05] transition-all text-zinc-300 hover:text-zinc-100 group">
                        <div class="w-4 h-4 rounded-full bg-[#c55b5b] flex items-center justify-center text-[6px] font-bold text-white border border-[#c55b5b]/10 user-avatar-display shrink-0">
                            U
                        </div>
                        Profile
                    </button>
                    <button hx-get="/api/config" hx-target="#modal-content" hx-on::after-request="openSettings()" onclick="toggleProfileMenu()"
                        class="w-full flex items-center justify-start gap-3 px-4 py-3 text-[13px] font-medium hover:bg-white/[0.05] transition-all text-zinc-300 hover:text-zinc-100 group">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        </svg>
                        Settings
                    </button>

                    <div class="h-[1px] bg-white/[0.08] my-1 mx-2"></div>

                    <button onclick="toggleProfileMenu(); openModal('Help')" 
                        class="w-full flex items-center justify-between px-4 py-3 text-[13px] font-medium hover:bg-white/[0.05] transition-all text-zinc-300 hover:text-zinc-100 group">
                        <div class="flex items-center gap-3">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Help
                        </div>
                        <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div onclick="toggleProfileMenu()"
                class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/[0.05] transition-colors cursor-pointer group">
                <div
                    class="w-8 h-8 rounded-full bg-[#c55b5b] flex items-center justify-center text-[10px] font-bold text-white border border-[#c55b5b]/10 user-avatar-display shrink-0">
                    U
                </div>
                <div class="flex-1 min-w-0 flex flex-col justify-center">
                    <p class="text-[13px] font-semibold text-zinc-200 truncate user-name-display">User account</p>
                    <p class="text-[11px] text-zinc-400 truncate mt-0.5">Free</p>
                </div>
            </div>
        </div>

    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative bg-[#212121]">
        <!-- Top Bar -->
        <header
            class="flex items-center justify-between px-6 py-3 border-b border-white/[0.04] sticky top-0 z-40 bg-[#212121]/80 backdrop-blur-md">
            <div class="flex items-center gap-4">
            <button aria-label="Toggle Sidebar" onclick="toggleSidebar()"
                    class="md:hidden p-2 hover:bg-white/7 rounded-lg text-zinc-400 hover:text-white">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div
                    class="flex items-center gap-2 group cursor-pointer px-3 py-2 rounded-lg hover:bg-white/3 transition-colors">
                    <span class="text-xs font-semibold text-zinc-400">TARS</span>
                    <span class="text-xs font-bold text-zinc-200 tracking-tight">{{ model_name }}</span>
                    <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button aria-label="Notifications" class="p-2 text-zinc-500 hover:text-zinc-200 transition-colors">
                    <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 21a9 9 0 100-18 9 9 0 000 18z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3"></path>
                    </svg>
                </button>
                <div
                    class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-zinc-400 border border-white/5 user-avatar-display">
                    TB</div>
            </div>
        </header>

        <!-- Message Area & Welcome Content -->
        <div id="chat-container"
            class="flex-1 overflow-y-auto flex flex-col items-center custom-scrollbar scroll-smooth">
            <div id="welcome-view"
                class="w-full max-w-2xl px-6 flex flex-col items-center justify-center min-h-[75vh] animate-fade-in translate-y-[-5%]">
                <!-- Open WebUI Style Logo Section -->
                <div class="flex items-center gap-3 mb-8 animate-float">
                    <div
                        class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                        <img src="/static/icon-192.png" alt="TARS" class="w-6 h-6 object-contain p-0.5">
                    </div>
                    <h1 class="text-2xl font-heading font-bold text-white tracking-tight">{{ model_name }}</h1>
                </div>

                <div class="w-full relative mb-12 max-w-3xl mx-auto">
                    <form hx-post="/api/chat" hx-target="#chat-messages" hx-swap="beforeend" class="chat-form">
                        <div class="input-container group p-2" data-state="single">
                            <input type="hidden" name="session_id" class="session_id_field" value="new">

                            <!-- Leading (Attach) -->
                            <div class="[grid-area:leading] flex items-center min-h-[40px]">
                                <button aria-label="Attach Files" type="button" class="flex items-center justify-center w-10 h-10 bg-transparent text-white rounded-full hover:bg-white/5 transition-colors" title="Attach Files">
                                    <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                                    </svg>
                                </button>
                            </div>

                            <!-- Primary (Textarea) -->
                            <div class="[grid-area:primary] flex items-center min-h-[40px] px-1 group-data-[state=multi]:px-3 group-data-[state=multi]:py-2 group-data-[state=multi]:pb-0">
                                <textarea name="content" aria-label="Message text area" placeholder="Ask anything..." autocomplete="off" autofocus
                                    class="chat-textarea w-full bg-transparent text-white py-2 outline-none placeholder:text-zinc-500 text-[17px] leading-relaxed resize-none h-[40px] max-h-[200px] overflow-y-auto custom-scrollbar"></textarea>
                            </div>

                            <!-- Action Bar (Footer in multi state) -->
                            <div class="[grid-area:footer] hidden group-data-[state=multi]:flex items-center justify-between min-h-[40px]">
                                 <div></div>
                            </div>

                            <!-- Trailing (Send + Mic) -->
                            <div class="[grid-area:trailing] flex items-center gap-1.5 min-h-[40px]">
                                <button aria-label="Voice Input" type="button" class="p-2 text-zinc-400 hover:text-zinc-200 transition-colors" title="Voice Input">
                                    <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"></path>
                                    </svg>
                                </button>
                                <button aria-label="Send Message" type="submit" class="flex items-center justify-center w-[34px] h-[34px] bg-white text-black rounded-full hover:bg-zinc-200 transition-all shadow-sm active:scale-95 mr-1" title="Send">
                                    <svg class="w-4 h-4" aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Suggested Actions (Cards) -->
                <div class="w-full max-w-md">
                    <div
                        class="flex items-center gap-2 text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4 px-1">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1a1 1 0 112 0v1a1 1 0 11-2 0zM13.243 15.657l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414-1.414zM6.464 14.95l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 1.414z">
                            </path>
                        </svg>
                        Suggested
                    </div>
                    <div class="space-y-2">
                        <button hx-post="/api/chat" hx-target="#chat-messages" hx-swap="beforeend"
                            hx-vals='js:{"content": "Show me a code snippet of a website\"s sticky header", "session_id": document.getElementById("current_session_id").value}'
                            onclick="hideWelcome()"
                            class="w-full flex flex-col items-start p-3 bg-zinc-900/30 border border-white/[0.04] hover:bg-zinc-800/50 hover:border-white/[0.08] rounded-xl transition-all group text-left">
                            <span class="text-[13px] font-semibold text-zinc-200">Show me a code snippet</span>
                            <span class="text-[11px] text-zinc-500">of a website's sticky header</span>
                        </button>

                        <button hx-post="/api/chat" hx-target="#chat-messages" hx-swap="beforeend"
                            hx-vals='js:{"content": "Help me study vocabulary for a college entrance exam", "session_id": document.getElementById("current_session_id").value}'
                            onclick="hideWelcome()"
                            class="w-full flex flex-col items-start p-3 bg-zinc-900/30 border border-white/[0.04] hover:bg-zinc-800/50 hover:border-white/[0.08] rounded-xl transition-all group text-left">
                            <span class="text-[13px] font-semibold text-zinc-200">Help me study</span>
                            <span class="text-[11px] text-zinc-500">vocabulary for a college entrance exam</span>
                        </button>

                        <button hx-post="/api/chat" hx-target="#chat-messages" hx-swap="beforeend"
                            hx-vals='js:{"content": "Give me tips to overcome procrastination", "session_id": document.getElementById("current_session_id").value}'
                            onclick="hideWelcome()"
                            class="w-full flex flex-col items-start p-3 bg-zinc-900/30 border border-white/[0.04] hover:bg-zinc-800/50 hover:border-white/[0.08] rounded-xl transition-all group text-left">
                            <span class="text-[13px] font-semibold text-zinc-200">Overcome procrastination</span>
                            <span class="text-[11px] text-zinc-500">give me tips</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Project View -->
            <div id="project-view" class="hidden w-full max-w-3xl px-6 pt-12 animate-fade-in flex flex-col items-center">
                <div class="flex flex-col w-full max-w-2xl mb-12">
                    <h2 id="project-title" class="text-[28px] font-medium text-white mb-6 flex items-center gap-3 justify-center text-center w-full">
                        <span id="project-icon" class="text-blue-500">🎓</span> <span id="project-name-display">Homework</span>
                    </h2>

                    <div class="w-full relative mb-6">
                        <div class="flex items-center gap-3 p-1.5 rounded-full bg-white/5 border border-white/5 focus-within:border-white/20 transition-all">
                            <svg class="w-5 h-5 text-zinc-500 ml-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                            <input type="text" aria-label="Project chat input" placeholder="why" class="flex-1 bg-transparent text-white py-3 px-2 outline-none placeholder:text-zinc-600 text-[16px]">
                            <button aria-label="Voice Input" type="button" class="p-2 text-zinc-400 hover:text-zinc-200 transition-colors" title="Voice Input">
                                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"></path>
                                </svg>
                            </button>
                            <button aria-label="Send" type="button" class="flex items-center justify-center w-[34px] h-[34px] bg-white text-black rounded-full hover:bg-zinc-200 transition-all shadow-sm mr-1">
                                <svg class="w-4 h-4" aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-6 border-b border-white/[0.04] mb-8 justify-center w-full">
                        <button class="px-1 py-2 text-sm font-medium text-white border-b-2 border-white -mb-[1px]">Chats</button>
                        <button class="px-1 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-300 border-b-2 border-transparent -mb-[1px] transition-colors">Sources</button>
                    </div>

                    <div class="flex flex-col items-center justify-center text-center py-20">
                        <p class="text-[15px] font-medium text-zinc-200 mb-1">No chats yet</p>
                        <p class="text-[13px] text-zinc-500">Chats in <span id="project-empty-name">Homework</span> will live here</p>
                    </div>
                </div>
            </div>

            <!-- Explorer View (Search, etc) -->
            <div id="explorer-view" class="hidden w-full max-w-3xl px-6 pt-12 animate-fade-in flex flex-col items-center">
                <h2 id="explorer-title" class="text-3xl font-heading font-bold text-white mb-8">Search</h2>
                <div class="w-full relative mb-12">

<script>
    function switchView(tabId) {
        const views = {
            'welcome': document.getElementById('welcome-view'),
            'workspace': document.getElementById('chat-messages'), // HTMX targets this
            'tasks': document.getElementById('chat-messages'),   // HTMX targets this
            'project': document.getElementById('project-view'),
            'explorer': document.getElementById('explorer-view'),
            'chat': document.getElementById('chat-messages')
        };
        
        const footer = document.getElementById('active-chat-footer');
        
        // Hide all views first
        Object.values(views).forEach(v => {
            if (v) {
                v.classList.add('hidden');
                v.style.display = 'none';
            }
        });

        // Specific logic for each tab
        if (tabId === 'welcome' || tabId === 'chat') {
            const welcome = views['welcome'];
            const chat = views['chat'];
            if (currentSessionId === 'new') {
                welcome.classList.remove('hidden');
                welcome.style.display = 'flex';
                if (footer) {
                    footer.classList.add('translate-y-full', 'opacity-0');
                }
            } else {
                chat.classList.remove('hidden');
                chat.style.display = 'block';
                if (footer) {
                    footer.classList.remove('translate-y-full', 'opacity-0');
                }
            }
        } else if (tabId === 'workspace' || tabId === 'tasks') {
            const chat = views['chat'];
            chat.classList.remove('hidden');
            chat.style.display = 'block';
            chat.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 space-y-4">
                    <div class="w-8 h-8 rounded-full border-2 border-white/10 border-t-white/40 animate-spin"></div>
                </div>
            `;
            if (footer) {
                footer.classList.add('translate-y-full', 'opacity-0');
            }
        } else if (tabId === 'project') {
            const project = views['project'];
            project.classList.remove('hidden');
            project.style.display = 'flex';
            if (footer) {
                footer.classList.add('translate-y-full', 'opacity-0');
            }
        }

        isTabMode = (tabId === 'workspace' || tabId === 'tasks' || tabId === 'project');
        closeSidebarOnMobile();
    }

    function hideWelcome(tabMode = false) {
        // Redefined to use switchView or just keep legacy support
        if (!tabMode && currentSessionId === 'new') {
            switchView('welcome');
        }
    }

    function showWelcome() {
        switchView('welcome');
        currentSessionId = 'new';
        document.querySelectorAll('.session_id_field').forEach(el => el.value = 'new');
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        sidebar.classList.toggle('-translate-x-full');
        if (backdrop) {
            backdrop.classList.toggle('opacity-0');
            backdrop.classList.toggle('pointer-events-none');
        }
    }

    function closeSidebarOnMobile() {
        if (window.innerWidth < 768) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }
    }

    function prepareTabContent() {
        // Now handled by switchView
    }

    function showProject(name, icon) {
        switchView('project');
        document.getElementById('project-name-display').innerText = name;
        document.getElementById('project-empty-name').innerText = name;
        document.getElementById('project-icon').innerText = icon || '📁';
    }

    function toggleProfileMenu() {
        const menu = document.getElementById('profile-context-menu');
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
        } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        }
    }

    function openSearchModal() {
        const backdrop = document.getElementById('search-modal-backdrop');
        const input = document.getElementById('search-modal-input');
        if (backdrop) {
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
            setTimeout(() => {
                if (input) input.focus();
                populateRecentHistory();
            }, 100);
        }
        closeSidebarOnMobile();
    }

    function closeSearchModal() {
        const backdrop = document.getElementById('search-modal-backdrop');
        if (backdrop) {
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
        }
    }

    async function populateRecentHistory() {
        const historyContainer = document.getElementById('recent-search-history');
        if (!historyContainer) return;
        
        try {
            const resp = await fetch('/api/sessions');
            if (resp.ok) {
                const sessions = await resp.json();
                if (sessions.length === 0) {
                    historyContainer.innerHTML = '';
                    return;
                }

                // Group by relative time (mock logic for now)
                const yesterday = [];
                const last7Days = [];
                const older = [];
                
                const now = new Date();
                sessions.forEach(s => {
                    const date = s.updated_at ? new Date(s.updated_at) : now;
                    const diff = (now - date) / (1000 * 60 * 60 * 24);
                    if (diff < 2) yesterday.push(s);
                    else if (diff < 7) last7Days.push(s);
                    else older.push(s);
                });

                let html = '';
                const renderGroup = (title, items) => {
                    if (items.length === 0) return '';
                    return `
                        <div class="mt-5 mb-2">
                            <p class="px-2 text-[11px] font-bold text-zinc-500 uppercase tracking-widest">${title}</p>
                        </div>
                        ${items.map(s => {
                            const title = s.metadata?.title || s.key.split(':').pop();
                            return `
                                <button onclick="closeSearchModal(); loadSession('${s.key}')" class="w-full flex items-center gap-3 p-3 hover:bg-white/[0.05] rounded-2xl transition-all group text-left">
                                    <div class="w-5 h-5 flex items-center justify-center text-zinc-500 group-hover:text-zinc-300">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                    </div>
                                    <span class="text-[14px] font-medium text-zinc-300 group-hover:text-white truncate">${title}</span>
                                </button>
                            `;
                        }).join('')}
                    `;
                };

                html += renderGroup('Yesterday', yesterday);
                html += renderGroup('Previous 7 Days', last7Days);
                html += renderGroup('Previous 30 Days', older);

                historyContainer.innerHTML = html;
            }
        } catch (err) {
            console.error("Failed to load history for search", err);
        }
    }

    const tarsConfig = JSON.parse(document.getElementById('tars-config-data').dataset.config);

    function checkOnboarding() {
        if (!tarsConfig.user || !tarsConfig.user.username) {
            openOnboardingModal();
        } else {
            updateUserProfile();
        }
    }

    function updateUserProfile() {
        if (tarsConfig.user && tarsConfig.user.username) {
            const username = tarsConfig.user.username;
            let initial = 'U';
            if (username.length > 0) {
                initial = username.charAt(0).toUpperCase();
            }

            document.querySelectorAll('.user-avatar-display').forEach(el => {
                el.innerText = initial;
            });
            document.querySelectorAll('.user-name-display').forEach(el => {
                el.innerText = username;
            });
        }
    }

    function openOnboardingModal() {
        const title = "Welcome to TARS";
        const content = `
            <div class="space-y-6 animate-fade-in">
                <div class="flex flex-col items-center text-center mb-4">
                    <div class="w-16 h-16 rounded-full bg-emerald-500/10 flex items-center justify-center mb-4 shadow-inner">
                        <img src="/static/icon-192.png" alt="TARS" class="w-10 h-10">
                    </div>
                    <p class="text-zinc-400 text-sm leading-relaxed px-4">Let's personalize your ultra-lightweight AI experience. Enter your details to get started.</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label for="setup-username" class="block text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Username</label>
                        <input type="text" id="setup-username" placeholder="e.g. Maverick" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500/50 transition-all">
                    </div>
                    <div>
                        <label for="setup-age" class="block text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Age</label>
                        <input type="number" id="setup-age" placeholder="25" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500/50 transition-all">
                    </div>
                </div>
                <button onclick="saveOnboarding()" class="w-full py-4 bg-white text-black font-bold rounded-xl hover:bg-zinc-200 transition-all transform active:scale-[0.98] shadow-lg">Complete Setup</button>
            </div>
        `;
        openModal(title, content);
    }

    async function saveOnboarding() {
        const username = document.getElementById('setup-username').value;
        const age = document.getElementById('setup-age').value;
        if (!username || !age) return alert('Please fill in all fields');
        
        const newConfig = {...tarsConfig};
        newConfig.user = { username, age: parseInt(age) };
        
        try {
            const formData = new FormData();
            formData.append('config_json', JSON.stringify(newConfig));
            const resp = await fetch('/api/config', { method: 'POST', body: formData });
            if (resp.ok) {
                closeModal();
                location.reload();
            }
        } catch (err) {
            console.error("Setup failed", err);
        }
    }

    function toggleSessionMenu(event, sessionId) {
        event.stopPropagation();
        const menu = document.getElementById(`session-menu-${sessionId}`);
        // Close all other menus
        document.querySelectorAll('[id^="session-menu-"]').forEach(m => {
            if (m.id !== `session-menu-${sessionId}`) m.classList.add('hidden');
        });
        menu.classList.toggle('hidden');

    async function deleteSession(sessionId) {
        if (!confirm('Are you sure you want to delete this chat?')) return;
        try {
            const resp = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
            if (resp.ok) {
                if (currentSessionId === sessionId) newChat();
                refreshSessions();
            }
        } catch (err) {
            console.error("Failed to delete session", err);
        }
    }

    async function renameSession(sessionId, currentTitle) {
        const newTitle = prompt('Enter new title:', currentTitle);
        if (!newTitle || newTitle === currentTitle) return;
        try {
            const resp = await fetch(`/api/sessions/${sessionId}/title`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: newTitle })
            });
            if (resp.ok) refreshSessions();
        } catch (err) {
            console.error("Failed to rename session", err);
        }
    }

        setTimeout(() => {
            document.getElementById('modal-content').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 text-zinc-500">
                    <div class="w-8 h-8 rounded-full border-2 border-white/10 border-t-white/40 animate-spin mb-4"></div>
                    <p class="text-sm">Loading...</p>
                </div>
            `;
        }, 300);
    }

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
        const profileMenu = document.getElementById('profile-context-menu');
        const profileBtn = profileMenu.nextElementSibling;
        if (!profileMenu.contains(e.target) && !profileBtn.contains(e.target)) {
            profileMenu.classList.add('hidden');
            profileMenu.classList.remove('flex');
        }

        // Close session menus
        if (!e.target.closest('.session-menu-trigger')) {
            document.querySelectorAll('[id^="session-menu-"]').forEach(m => m.classList.add('hidden'));
        }
    });

    function showExplorer(type = 'Search') {
        isTabMode = true;
        hideWelcome(true);
        const welcome = document.getElementById('welcome-view');
        const chatMessages = document.getElementById('chat-messages');
        const activeFooter = document.getElementById('active-chat-footer');
        const explorer = document.getElementById('explorer-view');
        const projectView = document.getElementById('project-view');
        const title = document.getElementById('explorer-title');
        
        if (projectView) projectView.classList.add('hidden');
        chatMessages.classList.add('hidden');
        welcome.classList.add('hidden');
        activeFooter.classList.add('translate-y-full', 'opacity-0');
        explorer.classList.remove('hidden');
        title.textContent = type;
        
        // Hide results and show initial state
        document.getElementById('search-modal-results').classList.add('hidden');
        document.getElementById('search-modal-initial').classList.remove('hidden');
        input.value = '';

        setTimeout(() => input.focus(), 100);
    }

    // Bind Enter key to search
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('search-modal-input');
        if (input) {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    executeSearch();
                }
            });
        }
    });

    async function executeSearch() {
        const input = document.getElementById('search-modal-input');
        const query = input.value.trim();
        const resultsContainer = document.getElementById('search-modal-results');
        const initialContainer = document.getElementById('search-modal-initial');
        
        if (!query) {
            resultsContainer.classList.add('hidden');
            initialContainer.classList.remove('hidden');
            return;
        }

        initialContainer.classList.add('hidden');
        resultsContainer.classList.remove('hidden');
        resultsContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 text-zinc-500">
                <div class="w-6 h-6 rounded-full border-2 border-white/10 border-t-white/40 animate-spin mb-4"></div>
                <p class="text-[13px]">Searching chats...</p>
            </div>
        `;

        try {
            const resp = await fetch(`/api/sessions/search?q=${encodeURIComponent(query)}`);
            if (resp.ok) {
                const sessions = await resp.json();
                
                if (sessions.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-12 text-zinc-500">
                            <svg class="w-8 h-8 mb-4 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <p class="text-[13px]">No matching chats found.</p>
                        </div>
                    `;
                    return;
                }

                resultsContainer.innerHTML = sessions.map(s => {
                    const title = s.metadata?.title || s.key.split(':').pop();
                    const date = s.updated_at ? new Date(s.updated_at).toLocaleDateString() : '';
                    return `
                        <button onclick="closeSearchModal(); loadSession('${s.key}')" class="w-full flex items-center gap-3 p-3 hover:bg-white/[0.05] rounded-2xl transition-all group text-left">
                                <div class="w-5 h-5 flex items-center justify-center text-zinc-500 group-hover:text-zinc-300">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <span class="text-[14px] font-medium text-zinc-300 group-hover:text-white truncate block">${title}</span>
                                    <span class="text-[11px] text-zinc-600 group-hover:text-zinc-500 truncate block">${date}</span>
                                </div>
                                <svg class="w-4 h-4 text-zinc-700 opacity-0 group-hover:opacity-100 transition-all transform translate-x-1 group-hover:translate-x-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    `;
                }).join('');
            } else {
                throw new Error("Failed to fetch search results");
            }
        } catch (err) {
            console.error("Search failed", err);
            resultsContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 text-red-400">
                    <p class="text-[13px]">Search failed. Please try again.</p>
                </div>
            `;
        }
    }

    function closeSearchModal() {
        const backdrop = document.getElementById('search-modal-backdrop');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
    }

    function showExplorer(type) {
        isTabMode = true;
        hideWelcome(true);
        const welcome = document.getElementById('welcome-view');
        const chatMessages = document.getElementById('chat-messages');
        const activeFooter = document.getElementById('active-chat-footer');
        const explorer = document.getElementById('explorer-view');
        const title = document.getElementById('explorer-title');

        chatMessages.classList.add('hidden');
        welcome.classList.add('hidden');
        activeFooter.classList.add('translate-y-full', 'opacity-0');
        if (explorer) {
            explorer.classList.remove('hidden');
        }
        if (title) {
            title.textContent = type;
        }
    }

    function hideExplorer() {
        const explorer = document.getElementById('explorer-view');
        if (explorer) {
            explorer.classList.add('hidden');
        }
        document.getElementById('chat-messages').classList.remove('hidden');
    }

    function newChat() {
        showWelcome();
    }

    async function loadSession(sessionId) {
        currentSessionId = sessionId;
        document.querySelectorAll('.session_id_field').forEach(el => el.value = sessionId);
        switchView('chat');

        const chatMessages = document.getElementById('chat-messages');
        chatMessages.innerHTML = `
            <div class="flex flex-col items-center justify-center py-20 space-y-4">
                <div class="w-8 h-8 rounded-full border-2 border-white/10 border-t-white/40 animate-spin"></div>
            </div>
        `;

        try {
            const resp = await fetch(`/api/sessions/${sessionId}`);
            if (resp.ok) {
                const html = await resp.text();
                chatMessages.innerHTML = html;
                scrollToTop();
                refreshSessions();
            } else {
                chatMessages.innerHTML = '<div class="text-zinc-500 p-12 text-center text-sm">Failed to load history</div>';
            }
        } catch (err) {
            chatMessages.innerHTML = `<div class="text-red-400/60 p-12 text-center text-sm">Error: ${err.message}</div>`;
        }
    }

    async function refreshSessions() {
        const historyList = document.getElementById('session-history');
        if (!historyList) return;
        try {
            const resp = await fetch('/api/sessions');
            if (resp.ok) {
                const sessions = await resp.json();
                if (sessions.length === 0) {
                    historyList.innerHTML = '<div class="px-4 py-4 text-xs text-zinc-600">No recent chats</div>';
                    return;
                }

                historyList.innerHTML = sessions.slice(0, 15).map(s => {
                    let title = s.metadata && s.metadata.title ? s.metadata.title : (s.key ? s.key.split(':').pop() : 'Session');
                    if (title.length > 20) title = title.substring(0, 20) + '...';
                    const active = s.key === currentSessionId ? 'bg-white/[0.08] text-white' : 'text-zinc-500 hover:bg-white/[0.03] hover:text-zinc-300';
                    return `
                    <div onclick="loadSession('${s.key}')" class="relative flex items-center gap-3 px-3 py-2 text-[13px] rounded-lg cursor-pointer transition-all group ${active}">
                        <span class="truncate flex-1 font-medium">${title}</span>
                        <div class="relative session-menu-trigger">
                            <button aria-label="Session Options" aria-haspopup="true" onclick="toggleSessionMenu(event, '${s.key}')" class="p-1 hover:bg-white/10 rounded-md transition-colors opacity-0 group-hover:opacity-100">
                                <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                            </button>
                            <div id="session-menu-${s.key}" class="absolute right-0 top-full mt-1 w-32 bg-[#252528] rounded-lg border border-white/10 shadow-xl overflow-hidden hidden z-50">
                                <button onclick="event.stopPropagation(); renameSession('${s.key}', '${title}')" class="w-full text-left px-3 py-1.5 hover:bg-white/5 text-[12px] text-zinc-300">Rename</button>
                                <button onclick="event.stopPropagation(); deleteSession('${s.key}')" class="w-full text-left px-3 py-1.5 hover:bg-red-500/10 text-[12px] text-red-400">Delete</button>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }
        } catch (err) {
            console.error("Failed to load sessions", err);
        }
    }

    function scrollToBottom() {
        const chatContainer = document.getElementById('chat-container');
        if (chatContainer) chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    function scrollToTop() {
        const chatContainer = document.getElementById('chat-container');
        if (chatContainer) chatContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let isUserScrollingUp = false;
    const chatContainer = document.getElementById('chat-container');

    if (chatContainer) {
        chatContainer.addEventListener('scroll', () => {
            const nearBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100;
            if (nearBottom) {
                isUserScrollingUp = false;
            } else {
                // Determine if user is scrolling up or down
                // Actually if they are not near bottom, we assume they are reading up
                isUserScrollingUp = true;
            }
        });
    }

    const observer = new MutationObserver(() => {
        if (!isTabMode && !isUserScrollingUp) {
            scrollToBottom();
        }
    });

    const msgElement = document.getElementById('chat-messages');
    if (msgElement) observer.observe(msgElement, { childList: true, subtree: true });

    document.body.addEventListener('htmx:sseClose', () => {
        refreshSessions();
    });

    document.body.addEventListener('htmx:afterOnLoad', (evt) => {
        if (evt.detail.target.id === 'chat-messages') {
            if (isTabMode) {
                scrollToTop();
            } else if (!isUserScrollingUp) {
                scrollToBottom();
            }
        }
    });

    function resetTextareas() {
        document.querySelectorAll('.chat-textarea').forEach(el => {
            el.value = '';
            el.style.height = '40px';
            el.closest('.input-container').setAttribute('data-state', 'single');
        });
    }

    // Initialize all textareas
    function initTextareas() {
        document.querySelectorAll('.chat-textarea').forEach(textarea => {
            if (textarea.dataset.initialized) return;
            textarea.dataset.initialized = 'true';
            
            const container = textarea.closest('.input-container');
            
            const handleInput = () => {
                textarea.style.height = '40px';
                const scrollHeight = textarea.scrollHeight;
                const newHeight = Math.min(scrollHeight, 200);
                textarea.style.height = Math.max(newHeight, 40) + 'px';
                
                const hasNewLine = textarea.value.includes('\n');
                const isMultiLine = hasNewLine || scrollHeight > 50;
                container.setAttribute('data-state', isMultiLine ? 'multi' : 'single');
            };

            textarea.addEventListener('input', handleInput);
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const form = textarea.closest('form');
                    form.dispatchEvent(new Event('submit', { cancelable: true }));
                    setTimeout(resetTextareas, 50);
                }
            });
        });
    }

    // Mutation observer to handle dynamically added containers if needed
    const inputObserver = new MutationObserver(initTextareas);
    inputObserver.observe(document.body, { childList: true, subtree: true });
    initTextareas();

    window.onload = () => {
        refreshSessions();
        checkOnboarding();
        renderProjectsSidebar();
    };

    let userProjects = [];

    function escapeHtmlAndQuotes(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function toggleCreateProjectBtn() {
        const input = document.getElementById('create-project-name');
        const btn = document.getElementById('submit-create-project-btn');
        if (input && btn) {
            btn.disabled = input.value.trim() === '';
        }
    }

    function createProject() {
        const input = document.getElementById('create-project-name');
        const name = input.value.trim();
        if (name) {
            let icon = '📁';
            if (name === 'Investing') icon = '💵';
            else if (name === 'Homework') icon = '🎓';
            else if (name === 'Writing') icon = '🖊️';
            else if (name === 'Travel') icon = '✈️';

            userProjects.push({ name, icon });
            renderProjectsSidebar();
            closeModal();
            showProject(name, icon);
        }
    }

    function renderProjectsSidebar() {
        const container = document.getElementById('sidebar-projects-container');
        if (!container) return;

        if (userProjects.length === 0) {
            container.innerHTML = `
                <button onclick="openModal('Create project'); closeSidebarOnMobile()"
                    class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                    Projects
                </button>
            `;
        } else {
            let projectsHtml = userProjects.map(p => {
                const safeName = escapeHtmlAndQuotes(p.name);
                const safeIcon = escapeHtmlAndQuotes(p.icon || '📁');
                return `
                <button onclick="showProject('${safeName}', '${safeIcon}'); closeSidebarOnMobile()"
                    class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                    <span class="w-4 h-4 text-center text-[12px] leading-tight flex items-center justify-center">${safeIcon}</span>
                    ${safeName}
                </button>
            `}).join('');

            container.innerHTML = `
                <div class="px-3 pt-3 pb-1 flex items-center gap-2 group cursor-pointer hover:text-zinc-200 text-zinc-400 transition-colors">
                    <span class="text-[10px] font-bold uppercase tracking-widest flex-1">Projects</span>
                    <svg class="w-3.5 h-3.5 opacity-70 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
                <button onclick="openModal('Create project'); closeSidebarOnMobile()"
                    class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium rounded-lg hover:bg-white/[0.05] hover:cursor-pointer transition-all text-zinc-400 hover:text-zinc-200 group">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                    </svg>
                    New project
                </button>
                ${projectsHtml}
            `;
        }
    }

    // Keyboard Shortcuts (Esc to close)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal();
            const profileMenu = document.getElementById('profile-context-menu');
            if (profileMenu && !profileMenu.classList.contains('hidden')) {
                toggleProfileMenu();
            }
        }
    });
</script>
{% endblock %}
